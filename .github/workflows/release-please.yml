name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    name: Prepare or publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Update release pull request or publish merged release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    name: Deploy published release
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    # Releases created with GITHUB_TOKEN do not start another release workflow.
    # Call the shared deployment only after Release Please publishes the release.
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ needs.release.outputs.tag_name }}
