name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned generator
        run: python -m pip install -r requirements.txt
      - name: Test validation rules
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate structure, metadata, navigation, and local links
        run: python scripts/validate-content.py
      - name: Build with strict link validation
        run: zensical build --strict
      - name: Retain static site for review
        uses: actions/upload-artifact@v4
        with:
          name: help-center-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 7
