name: Deploy release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        description: Published stable release tag returned by Release Please
        required: true
        type: string

permissions:
  contents: read

# Serialize publication. Both guards reject old releases and moved tags.
concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build published release
    if: >-
      (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       github.workflow_ref == format('{0}/.github/workflows/release-please.yml@refs/heads/main', github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out release verification tools
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select the requested release
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('A stable vMAJOR.MINOR.PATCH release tag is required.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - name: Verify published release and resolve its commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python scripts/verify-release.py --tag "$RELEASE_TAG"
      - name: Check out the exact released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Install pinned generator
        run: python -m pip install -r requirements.txt
      - name: Apply the configured Pages URL
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/configure-site-url.py "$PAGES_URL"
      - name: Validate and build the release
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate-content.py
          zensical build --strict
      - name: Upload the released static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    name: Publish released site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject superseded releases or moved tags before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: python scripts/verify-release.py --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA"
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
